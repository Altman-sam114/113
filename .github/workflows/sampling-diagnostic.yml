name: Frozen Sampling Diagnostic

"on":
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA to diagnose
        required: true
        type: string
      fixture_release_tag:
        description: Task-specific unpublished encrypted local model draft
        required: true
        type: string

permissions:
  contents: read

jobs:
  sampling:
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned native dependency
        uses: ./.github/actions/prepare-native-runtime
      - name: Compare all ten tasks across all four frozen profiles
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          FIXTURE_RELEASE_TAG: ${{ inputs.fixture_release_tag }}
          LOCALGEMMA_SAMPLING_FIXTURE_KEY: ${{ secrets.LOCALGEMMA_SAMPLING_FIXTURE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: PYTHONDONTWRITEBYTECODE=1 python3 Tools/native_sampling_diagnostic.py
      - name: Preserve all original answers and diagnostic sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localgemma-sampling-${{ github.sha }}-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: sampling-results
          if-no-files-found: error
          retention-days: 30
